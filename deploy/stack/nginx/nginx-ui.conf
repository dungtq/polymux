# Mounted over the image's /etc/nginx/conf.d/nginx-ui.conf.
# The nginx-ui panel is served by the nginx-ui app on :9000 (EnableHTTPS), not by nginx.
# nginx :80 / :443 serve only the vhosts in sites-enabled (pm.conf, ntfy.conf, your own).

# WebSocket upgrade (pm /term, ntfy /ws). Used by the vhosts.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

# Catch-all for unknown host names on :80.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Public root certificate, for clients to download and trust:
    #   curl -o ca.crt http://<server>/root-ca.crt
    location = /root-ca.crt {
        default_type application/x-x509-ca-cert;
        alias /etc/nginx/ssl/local/ca.crt;
    }

    location / {
        default_type text/plain;
        return 404;
    }
}

# Unknown host names on :443: refuse the TLS handshake.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

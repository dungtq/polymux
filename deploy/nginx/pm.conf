# Example nginx vhost for pm on the host (nginx installed natively). In a container, proxy to the
# docker gateway instead of 127.0.0.1 and add that address to pm.toml `binds` (see deploy/stack/README.md).
# Put this map once in the http {} block (e.g. conf.d/upgrade-map.conf):
#   map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
    listen 80;
    listen [::]:80;
    server_name pm.example.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2: over HTTP/1.1 browsers allow only 6 connections per site and each open tab holds an
    # SSE stream, so a few tabs starve every new request ("loading" forever).
    http2 on;
    server_name pm.example.lan;
    access_log /var/log/nginx/pm.access.log;

    ssl_certificate /etc/nginx/ssl/pm.example.lan/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/pm.example.lan/privkey.pem;

    client_max_body_size 10m;  # app caps image uploads at 5 MB (web/routes/chat.py IMG_MAX_BYTES)

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Content-Security-Policy is set per response by the app (login and /term differ);
    # a second header here would be enforced as well and break them.

    # Builder preview: pm's own sandboxed iframe (no allow-same-origin) may frame these; the app sets
    # the sandbox CSP. add_header in a location replaces the inherited ones, so repeat them.
    location ~ ^/a/[^/]+/builder/(frame|f)/ {
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;  # needs the $connection_upgrade map (top of this file)
        # SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}

name: Bug report
description: Something in pm does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems go to a private advisory, not here (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw. A screenshot helps for UI problems.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - classic
        - dt
        - both
        - not a UI problem
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Firefox 140 on a 27" desktop, Safari on iPhone 15
  - type: input
    id: version
    attributes:
      label: pm version or commit
      description: The version from `pyproject.toml` or the output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant lines from `journalctl --user -u pm` or the browser console.
        Remove tokens, TOTP codes, passwords, cookies, host names and any other secrets before you paste.
      render: text

name: Feature request
description: Suggest a change or a new feature.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The core stays small. Features that only some setups need are best built as a plugin
        (docs/CONFIG.md "Theme and plugins").
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What pm should do. Mock-ups or screenshots welcome.
    validations:
      required: true
  - type: checkboxes
    id: plugin
    attributes:
      label: Plugin
      options:
        - label: This could be a plugin instead of a change to the core.
